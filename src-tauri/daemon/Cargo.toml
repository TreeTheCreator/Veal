[package]
name = "veal-daemon"
version = "0.1.2"
description = "Veal's background service: owns every shell so agents outlive the window (plan-19)"
authors = ["Triyan"]
edition = "2021"

[lib]
name = "veal_daemon"
path = "src/lib.rs"

[[bin]]
name = "veal-daemon"
path = "src/main.rs"

[dependencies]
veal-core = { path = "../core" }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt", "rt-multi-thread", "sync", "time", "macros"] }
