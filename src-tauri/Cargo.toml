[package]
name = "veal"
version = "0.1.0"
description = "Terminal multiplexer, file viewer and task manager for agentic dev work"
authors = ["Triyan"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "veal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-single-instance = "2"
notify = "8"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
trash = "5"

[target.'cfg(windows)'.dependencies]
# Already in the tree through Tauri; `fs::write` puts a saved file's
# hidden/system bits back after the rename (plan-13).
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.27.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
