[package]
name = "veal-core"
version = "0.1.2"
description = "Veal's shells, agent detection and proxy resolution, with no Tauri (plan-19)"
authors = ["Triyan"]
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
portable-pty = "0.9.0"
alacritty_terminal = "0.26"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[dev-dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Already in the tree through Tauri. WinHttp and Foundation read the user's
# proxy setting (plan-18).
windows-sys = { version = "0.61", features = ["Win32_Networking_WinHttp", "Win32_Foundation"] }
